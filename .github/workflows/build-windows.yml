name: Build Nilova for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آمادهسازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: آمادهسازی Rust
        uses: dtolnay/rust-toolchain@stable

      - name: نصب بستهها
        run: npm install

      - name: دانلود هسته Xray
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v25.6.9/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray-extract" -Force
          Copy-Item "xray-extract\xray.exe" "src-tauri\resources\xray.exe"
          Remove-Item "xray.zip"

      - name: ساخت برنامه نیلوا
        run: npm run tauri -- build

      - name: ذخیره فایل خروجی
        uses: actions/upload-artifact@v4
        with:
          name: Nilova-Windows
          path: src-tauri/target/release/nilova-desktop.exe
          if-no-files-found: error
