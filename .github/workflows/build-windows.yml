name: Build Nilova for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آمادهسازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: آمادهسازی Rust
        uses: dtolnay/rust-toolchain@stable

      - name: نصب بستهها
        run: npm install

      - name: دانلود هسته Xray
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "src-tauri\target\release" -Force
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray-extract" -Force
          Copy-Item "xray-extract\xray.exe" "src-tauri\target\release\xray.exe"
          Remove-Item "xray.zip"

      - name: ساخت برنامه نیلووا
        run: npm run tauri -- build

      - name: کنار هم قرار دادن فایلها
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "Nilova-desktop" -Force
          Copy-Item "src-tauri\target\release\Nilova-desktop.exe" "Nilova-desktop\"
          Copy-Item "src-tauri\target\release\xray.exe" "Nilova-desktop\"

      - name: ذخیره فایل خروجی
        uses: actions/upload-artifact@v4
        with:
          name: Nilova-Windows
          path: Nilova-desktop/*
          if-no-files-found: error
