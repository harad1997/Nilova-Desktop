name: Nilova Rust Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format code
  run: cargo fmt

      - name: Cargo check
        run: cargo check
