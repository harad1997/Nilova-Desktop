[package]
name = "Nilova-desktop"
version = "0.1.0"
description = "Nilova Desktop Client"
authors = ["Nilova"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_UI_Shell"] }
